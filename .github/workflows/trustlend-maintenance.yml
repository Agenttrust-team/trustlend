name: TrustLend testnet indexer
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: trustlend-maintenance
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Index contract events and retry pending deliveries
        env:
          MAINTENANCE_URL: ${{ secrets.TRUSTLEND_MAINTENANCE_URL }}
          CRON_SECRET: ${{ secrets.TRUSTLEND_CRON_SECRET }}
        run: |
          if [ -z "$MAINTENANCE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "TrustLend maintenance secrets are not configured; skipping scheduled indexer run."
            exit 0
          fi
          curl --fail-with-body --max-time 295 --retry 1 \
            --header "Authorization: Bearer $CRON_SECRET" "$MAINTENANCE_URL"
